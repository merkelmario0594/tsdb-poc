ports:
  - port: 9000
    onOpen: open-browser
    visibility: public
  - port: 8123
    onOpen: open-browser
    visibility: public
  - port: 3000
    onOpen: open-browser
    visibility: public
  - port: 8812
    visibility: public
  - port: 9009
    visibility: public
  - port: 9005
    visibility: public

tasks:
  - name: Datenbanken starten
    init: echo "Bereite Container vor..."
    command: docker compose up -d

  - name: Kostenlosen KI-Support einrichten
    command: |
      echo "Installiere Google GenAI CLI..."
      npm install -g @google/genai
      echo "--------------------------------------------------------"
      echo "DEIN KI-SUPPORT IST BEREIT!"
      echo "Um die KI zu starten, tippe einfach: gemini-cli"
      echo "--------------------------------------------------------"
